name: Build site
on:
  push:
    branches: [main]
    paths-ignore: ["site-update.zip", ".github/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"   # every day at 05:47 IST: picks up new ORCID publications
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack site-changes.zip if one was uploaded
        run: |
          if [ -f site-changes.zip ]; then
            unzip -o site-changes.zip -x '.github/*'
            git rm -q site-changes.zip
          fi
      - run: python3 build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild site" && git push)
