name: Unpack site update
on:
  push:
    paths: ["site-update.zip"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o site-update.zip
          rm -f site-update.zip blogs/index.json .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply site update"
          git push